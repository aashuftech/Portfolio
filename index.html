    <script>
      (function() {
        try {
          const stored = localStorage.getItem('portfolio_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
